[package]
name = "claw402-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic restricted signer for Claw402 x402 SVM purchases"
publish = false

[dependencies]
base64 = "0.22"
bincode = "1.3"
claw402-policy = { path = "../../plugin/claw402-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
# Pin the mutually compatible wincode generation used by solana-message 4.4.
# Newer transitive minor releases currently mix wincode 0.5 and 0.6 when
# clippy enables development features.
solana-address = "=2.6.1"
solana-compute-budget-interface = "3.0.0"
solana-hash = "=4.5.0"
solana-short-vec = "=3.2.2"
solana-sdk = "4.0.1"
spl-associated-token-account = "8.0.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
thiserror = "2"
toml = "0.8"
ureq = { version = "3.1.4", features = ["json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
